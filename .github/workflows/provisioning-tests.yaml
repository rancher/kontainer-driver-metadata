name: Provisioning tests

on:
  push:
    branches:
      - 'dev-v*'
      - 'release-v*'
  pull_request:
    branches:
      - 'dev-v*'
      - 'release-v*'

permissions: {}

jobs:
  build-ci-image:
    permissions:
      contents: read
    runs-on:
      - runs-on
      - spot=false
      - runner=4cpu-linux-x64
      - run-id=${{ github.run_id }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and cache CI image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: Dockerfile.ci
          tags: kdm-ci:latest
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup-matrix:
    name: Build Test Matrix
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.27 # zizmor: ignore[unpinned-images] -- internal image is exempt from this rule
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build matrix
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPLICIT_SCOPES: "kdm"
        run: |
          set -eo pipefail

          if [ -z "$EXPLICIT_SCOPES" ]; then
            export ALL=1
          fi

          MATRIX="$(bash ./scripts/fetch-provisioning-matrix)"

          # Expect compact {"include":[...]} JSON on a single line, bail otherwise.
          if ! echo "$MATRIX" | jq -e 'has("include") and (.include | type == "array")' >/dev/null; then
            echo "error: unexpected matrix output: $MATRIX" >&2
            exit 1
          fi

          # An empty matrix is an error in GHA, so the test job below is gated on count instead.
          COUNT="$(echo "$MATRIX" | jq '.include | length')"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "event=$EVENT_NAME, entries=$COUNT"
          echo "$MATRIX" | jq .

  provisioning-test:
    name: ${{ matrix.shard.V2PROV_TEST_DIST }} 1.${{ matrix.k8s-minor }} ${{ matrix.shard.V2PROV_TEST_RUN_REGEX }}
    needs: [build-ci-image, setup-matrix]
    if: needs.setup-matrix.outputs.count != '0'
    permissions:
      contents: read
      id-token: write
    runs-on:
      - runs-on
      - spot=false
      - runner=${{ matrix.shard.V2PROV_TEST_CPUS }}cpu-linux-x64
      - run-id=${{ github.run_id }}
    #timeout-minutes: 90
    strategy:
      max-parallel: 18
      fail-fast: false
      matrix:
        k8s-minor: [35] # TODO: restore [35, 36, 37] once the new CI matrix has been validated
        shard: ${{ fromJSON(needs.setup-matrix.outputs.matrix).include }}
    env:
      # registry-cache container is reachable from the CI container via the Docker bridge IP
      REGISTRY: "172.17.0.2:5000"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: "0"
      - name: testdata
        run: mkdir -p build/testdata
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build CI image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: Dockerfile.ci
          tags: kdm-ci:latest
          load: true
          cache-from: type=gha
      - name: Remove BuildKit builder
        # The BuildKit builder container would auto-restart after `sudo systemctl restart docker`,
        # taking the 172.17.0.2 bridge IP before kdm-ci does. The registry-cache pod inside kdm-ci
        # uses hostPort:5000, so the rancher provisioning-tests script hard-codes 172.17.0.2:5000
        # as the registry address. Removing the builder here ensures kdm-ci is the first container
        # on the bridge after Docker restarts and therefore gets 172.17.0.2.
        run: docker buildx rm
      - name: Configure Docker for cgroupfs/insecure-registry
        run: |
          echo '{"insecure-registries": ["172.17.0.2:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sudo docker info
      - name: Retrieve Registry Endpoint
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGE_REGISTRY_ENDPOINT;
      - name: Provisioning Operations tests
        run: |
          set -eo pipefail
          docker run --rm \
            -v ${{ github.workspace }}:/go/src/github.com/rancher/kontainer-driver-metadata \
            -v ${{ github.workspace }}/build:/tmp \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --privileged \
            --env LAST_COMMUNITY_RANCHER \
            --env V2PROV_TEST_DIST \
            --env V2PROV_TEST_RUN_REGEX \
            --env V2PROV_TEST_PARALLELISM \
            --env CATTLE_FEATURES \
            --env KDM_TEST_K8S_MINOR \
            --env FORCE_PROVISIONING_TESTS \
            --env PREV_COMMIT_PR_SHA \
            --env PREV_COMMIT_PUSH_SHA \
            --env CATTLE_AGENT_IMAGE \
            --env GITHUB_EVENT_NAME \
            --env GITHUB_RUN_NUMBER \
            --env CI \
            --env STAGE_REGISTRY_ENDPOINT \
            kdm-ci provisioning-tests | tee ./build/provtest_output.txt
        env:
          LAST_COMMUNITY_RANCHER: v2.16.99
          V2PROV_TEST_DIST: ${{ matrix.shard.V2PROV_TEST_DIST }}
          V2PROV_TEST_RUN_REGEX: ${{ matrix.shard.V2PROV_TEST_RUN_REGEX }}
          V2PROV_TEST_PARALLELISM: ${{ matrix.shard.V2PROV_TEST_PARALLELISM }}
          CATTLE_FEATURES: ${{ matrix.shard.CATTLE_FEATURES }}
          KDM_TEST_K8S_MINOR: ${{ matrix.k8s-minor }}
          FORCE_PROVISIONING_TESTS: "1" # TODO: remove once the new CI matrix has been validated
          PREV_COMMIT_PR_SHA: ${{ github.event.pull_request.base.sha }}
          PREV_COMMIT_PUSH_SHA: ${{ github.event.before }}
          CATTLE_AGENT_IMAGE: "rancher/rancher-agent:v2.15-head" # TODO: change to v2.16-head after v2.16.0 is released
      - name: Move plaintext test results for upload
        if: always()
        id: test_output
        env:
          TEST_REGEX: ${{ matrix.shard.V2PROV_TEST_RUN_REGEX }}
        run: |
          # Regexes can be hundreds of characters long, so keep a short readable prefix and
          # append a hash to stay unique and within filename / artifact name limits.
          SUITE_PREFIX="$(printf '%s' "$TEST_REGEX" | sed 's/Test//' | tr -cd 'A-Za-z0-9-' | cut -c1-40)"
          SUITE_HASH="$(printf '%s' "$TEST_REGEX" | sha1sum | cut -c1-8)"
          export TESTSUITE="${SUITE_PREFIX}-${SUITE_HASH}"
          echo "suite=${TESTSUITE}" >> $GITHUB_OUTPUT
          REPORT_PATH="/tmp/report-${{ matrix.shard.V2PROV_TEST_DIST }}-${{ matrix.k8s-minor }}-$TESTSUITE.txt"

          # check to see if the test results exist - if they do move them out, otherwise just create
          # an empty file (empty test results)
          if [ -f ./build/out.txt ]; then
            echo "test results found at ./build/out.txt, moving to $REPORT_PATH"
            mv ./build/out.txt "$REPORT_PATH"
          else
            echo "No test results found at ./build/out.txt, creating empty report at $REPORT_PATH"
            touch "$REPORT_PATH"
          fi

          # Collect Rancher server log (includes embedded k3s output) for debugging startup failures.
          # /tmp inside the container is bind-mounted to ./build on the host, so rancher.log is at ./build/rancher.log.
          RANCHER_LOG_PATH="${REPORT_PATH%.txt}.rancher.log"
          if [ -f ./build/rancher.log ]; then
            echo "Rancher server log found at ./build/rancher.log, copying to $RANCHER_LOG_PATH"
            cp ./build/rancher.log "$RANCHER_LOG_PATH"
          else
            echo "No Rancher server log found at ./build/rancher.log"
          fi
      - name: Upload Plain Text Test Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: "Test Results ${{ matrix.shard.V2PROV_TEST_DIST }} ${{ matrix.k8s-minor }} ${{ steps.test_output.outputs.suite }}"
          path: "/tmp/report-${{ matrix.shard.V2PROV_TEST_DIST }}-${{ matrix.k8s-minor }}-${{ steps.test_output.outputs.suite }}.*"
      - name: Upload logdump artifact if we had some tests failures
        if: failure()
        uses: rancherlabs/cowboy@73acfb7bc97b55bc18ea5bc1ee8232a8ffcb4576
        with:
          log-file-path: ./build/provtest_output.txt
          artifact-retention-days: 7
          artifact-name: "Parsed Failure Log Dump (${{ matrix.shard.V2PROV_TEST_DIST }}, ${{ matrix.k8s-minor }}, ${{ steps.test_output.outputs.suite }})"

  # provisioning_tests_summary prints a friendly summary of what tests ran. It's true purpose
  # is to act as an anchor, giving us a single check that forwards the results of the dynamic matrix
  # which we can use as a 'required check'
  provisioning_tests_summary:
    if: always()
    name: Provisioning Tests Summary
    needs: [build-ci-image, setup-matrix, provisioning-test]
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.27 # zizmor: ignore[unpinned-images] -- internal image is exempt from this rule
    env:
      SETUP_MATRIX_RESULT: ${{ needs.setup-matrix.result }}
      PROVISIONING_TESTS_RESULT: ${{ needs.provisioning-test.result }}
    steps:
      - name: Generate provisioning tests summary
        shell: bash
        run: |
          echo "Provisioning Test Summary"
          echo "--------------------------------"
          if [[ "${SETUP_MATRIX_RESULT}" != "success" && "${SETUP_MATRIX_RESULT}" != "skipped" ]]; then
            echo "Failed to setup test matrix."
            exit 1
          fi

          if [[ "${PROVISIONING_TESTS_RESULT}" != "success" && "${PROVISIONING_TESTS_RESULT}" != "skipped" ]]; then
            echo "Some provisioning tests failed. Please check the logs for details."
            exit 1
          fi

  convert-to-xml:
    needs: [provisioning-test]
    if: always()
    permissions:
      contents: read
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: registry.suse.com/bci/bci-base:15.7
    steps:
      - name: Install golang
        run: |
          zypper --non-interactive install golang
      - name: Fetch plaintext test output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: /tmp/test-results/
          pattern: "!*.dockerbuild"
      - name: Convert test results to XML
        run: |
          shopt -s nullglob
          files=(/tmp/test-results/report-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No report files found in /tmp/test-results/, skipping conversion."
            exit 0
          fi
          # renovate: datasource=github-tags depName=jstemmer/go-junit-report digestVersion=v2.1.0
          go install github.com/jstemmer/go-junit-report/v2@14d61e6e75e3f3c74551d757ad936e8e88014464
          for file in "${files[@]}"; do
            echo "Processing $file..."
            "$(go env GOPATH)/bin/go-junit-report" < "$file" > "${file%.txt}.xml"
          done
      - name: Upload XML Test Results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: 'XML Results'
          path: "/tmp/test-results/report-*.xml"

  event-file:
    permissions:
      contents: read
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: registry.suse.com/bci/bci-base:15.7
    steps:
      - name: Upload GH Event File
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: 'Event File'
          path: ${{ github.event_path }}
