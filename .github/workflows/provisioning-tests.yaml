name: Provisioning tests

on:
  push:
    branches:
      - 'dev-v*'
      - 'release-v*'
  pull_request:
    branches:
      - 'dev-v*'
      - 'release-v*'

permissions: {}

jobs:
  build-ci-image:
    permissions:
      contents: read
    runs-on:
      - runs-on
      - spot=false
      - runner=4cpu-linux-x64
      - run-id=${{ github.run_id }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and cache CI image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: Dockerfile.ci
          tags: kdm-ci:latest
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup-matrix:
    name: Build Test Matrix
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.27 # zizmor: ignore[unpinned-images] -- internal image is exempt from this rule
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
      k8s-minors: ${{ steps.build.outputs.k8s-minors }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build matrix
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPLICIT_SCOPES: "kdm"
          K8S_MINORS: "[35, 36, 37]" # TODO: restore [35, 36, 37] once the new CI matrix has been validated
        run: |
          set -eo pipefail

          if [ -z "$EXPLICIT_SCOPES" ]; then
            export ALL=1
          fi

          MATRIX="$(bash ./scripts/fetch-provisioning-matrix)"

          # Expect compact {"include":[...]} JSON on a single line, bail otherwise.
          if ! echo "$MATRIX" | jq -e 'has("include") and (.include | type == "array")' >/dev/null; then
            echo "error: unexpected matrix output: $MATRIX" >&2
            exit 1
          fi

          # An empty matrix is an error in GHA, so the test job below is gated on count instead.
          COUNT="$(echo "$MATRIX" | jq '.include | length')"

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
            echo "k8s-minors=$(echo "$K8S_MINORS" | jq -c .)"
          } >> "$GITHUB_OUTPUT"

          echo "event=$EVENT_NAME, entries=$COUNT"
          echo "$MATRIX" | jq .

          # Held-back matrix jobs don't appear in the UI until they start, so publish the full plan up front.
          # Rows are ordered like GHA expands the matrix (k8s-minor outer, shard inner) so # matches the
          # [index/total] prefix in each job name.
          TOTAL="$(jq -n --argjson m "$MATRIX" --argjson k "$K8S_MINORS" '($m.include | length) * ($k | length)')"
          {
            echo "## Provisioning tests: $TOTAL jobs"
            echo
            echo "| # | Dist | K8s | Regex |"
            echo "|---|------|-----|-------|"
            jq -rn --argjson m "$MATRIX" --argjson k "$K8S_MINORS" '
              [$k[] as $minor | $m.include[] | {minor: $minor, s: .}]
              | to_entries[]
              | "| \(.key) | \(.value.s.V2PROV_TEST_DIST) | 1.\(.value.minor) | `\(.value.s.V2PROV_TEST_RUN_REGEX | gsub("\\|"; "\\|"))` |"'
          } >> "$GITHUB_STEP_SUMMARY"

  provisioning-test:
    name: "[${{ strategy.job-index }}/${{ strategy.job-total }}] ${{ matrix.shard.V2PROV_TEST_DIST }} 1.${{ matrix.k8s-minor }} ${{ matrix.shard.V2PROV_TEST_RUN_REGEX }}"
    needs: [build-ci-image, setup-matrix]
    if: needs.setup-matrix.outputs.count != '0'
    permissions:
      contents: read
      id-token: write
    strategy:
      # Must call a reusable workflow for this to work with RunsOn. Inline matrix jobs are all created
      # up front, so a runner is launched per cell and the held-back ones idle out before being scheduled.
      max-parallel: 18
      fail-fast: false
      matrix:
        k8s-minor: ${{ fromJSON(needs.setup-matrix.outputs.k8s-minors) }}
        shard: ${{ fromJSON(needs.setup-matrix.outputs.matrix).include }}
    uses: ./.github/workflows/provisioning-test-shard.yaml
    with:
      k8s-minor: ${{ matrix.k8s-minor }}
      dist: ${{ matrix.shard.V2PROV_TEST_DIST }}
      run-regex: ${{ matrix.shard.V2PROV_TEST_RUN_REGEX }}
      parallelism: ${{ matrix.shard.V2PROV_TEST_PARALLELISM }}
      cattle-features: ${{ matrix.shard.CATTLE_FEATURES }}
      cpus: ${{ matrix.shard.V2PROV_TEST_CPUS }}

  # provisioning_tests_summary prints a friendly summary of what tests ran. It's true purpose
  # is to act as an anchor, giving us a single check that forwards the results of the dynamic matrix
  # which we can use as a 'required check'
  provisioning_tests_summary:
    if: always()
    name: Provisioning Tests Summary
    needs: [build-ci-image, setup-matrix, provisioning-test]
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.27 # zizmor: ignore[unpinned-images] -- internal image is exempt from this rule
    env:
      SETUP_MATRIX_RESULT: ${{ needs.setup-matrix.result }}
      PROVISIONING_TESTS_RESULT: ${{ needs.provisioning-test.result }}
    steps:
      - name: Generate provisioning tests summary
        shell: bash
        run: |
          echo "Provisioning Test Summary"
          echo "--------------------------------"
          if [[ "${SETUP_MATRIX_RESULT}" != "success" && "${SETUP_MATRIX_RESULT}" != "skipped" ]]; then
            echo "Failed to setup test matrix."
            exit 1
          fi

          if [[ "${PROVISIONING_TESTS_RESULT}" != "success" && "${PROVISIONING_TESTS_RESULT}" != "skipped" ]]; then
            echo "Some provisioning tests failed. Please check the logs for details."
            exit 1
          fi

  convert-to-xml:
    needs: [provisioning-test]
    if: always()
    permissions:
      contents: read
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: registry.suse.com/bci/bci-base:15.7
    steps:
      - name: Install golang
        run: |
          zypper --non-interactive install golang
      - name: Fetch plaintext test output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: /tmp/test-results/
          pattern: "!*.dockerbuild"
      - name: Convert test results to XML
        run: |
          shopt -s nullglob
          files=(/tmp/test-results/report-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No report files found in /tmp/test-results/, skipping conversion."
            exit 0
          fi
          # renovate: datasource=github-tags depName=jstemmer/go-junit-report digestVersion=v2.1.0
          go install github.com/jstemmer/go-junit-report/v2@14d61e6e75e3f3c74551d757ad936e8e88014464
          for file in "${files[@]}"; do
            echo "Processing $file..."
            "$(go env GOPATH)/bin/go-junit-report" < "$file" > "${file%.txt}.xml"
          done
      - name: Upload XML Test Results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: 'XML Results'
          path: "/tmp/test-results/report-*.xml"

  event-file:
    permissions:
      contents: read
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: registry.suse.com/bci/bci-base:15.7
    steps:
      - name: Upload GH Event File
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: 'Event File'
          path: ${{ github.event_path }}
